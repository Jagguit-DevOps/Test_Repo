name: testing_workflow

on:
  push:
    branches:
      - none

  workflow_dispatch:
    inputs:
      deploymentEnvironment:
        description: 'Select Deployment Environment'
        required: true
        type: choice
        default: 'dev'
        options:
          - dev
          - Production

      webAppName:
        description: 'Select Web App'
        required: true
        type: choice
        default: 'myadotesting'
        options:
          - myadotesting
          - newwebappfortest

      agentImage:
        description: 'Select Build/Deployment Agent'
        required: true
        type: choice
        default: 'ubuntu-latest'
        options:
          - ubuntu-latest
          - windows-latest

env:
  PYTHON_VERSION: '3.12'

# =====================================================
# CI JOB - BUILD AND TEST
# =====================================================

jobs:

  build:

    name: CI - Build and Test

    # For manual execution, use selected agent.
    # For push trigger, default to ubuntu-latest.
    runs-on: ${{ inputs.agentImage || 'ubuntu-latest' }}

    steps:

      # Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # Install Dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Create Deployment Package
      - name: Create Deployment Package
        shell: bash
        run: |
          mkdir -p artifact
          zip -r artifact/webapp.zip . \
            -x ".git/*" \
            -x "artifact/*" \
            -x "__pycache__/*"


      # Publish Artifact
      - name: Upload Web App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: artifact/webapp.zip


# =====================================================
# CD JOB - DEPLOYMENT
# =====================================================

  deploy:

    name: Deploy Web App

    # Run only after the build job succeeds
    needs: build

    # Use your self-hosted runner
    runs-on: ${{ inputs.agentImage || 'ubuntu-latest' }}

    # Use the selected GitHub Environment
    environment:
      name: ${{ inputs.deploymentEnvironment || 'dev' }}

    steps:

      # Download artifact created by the build job
      - name: Download Web App Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: artifact


      # Login to Azure using GitHub Secret
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "5533e627-73b6-4d85-9f44-1cba93de9ea6",
              "clientSecret": "xGQ8Q~C6ibqtSwRuswv5IAtut_XqI_VUnLMkUchS",
              "subscriptionId": "e2048caf-3ee9-47f3-bb37-793093775af5",
              "tenantId": "4cb47cf3-58c2-4ea5-929c-f177a4c7d5a7"
  
            }


      # Deploy artifact to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.webAppName || 'myadotesting' }}
          package: artifact/webapp.zip
